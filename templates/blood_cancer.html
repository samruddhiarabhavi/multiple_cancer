<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Blood Cancer Prediction</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      color: #222;
      background: url("{{ url_for('static', filename='baground.jpg') }}") no-repeat center center fixed;
      background-size: cover;
    }

    header {
      background: rgba(255, 255, 255, 0.95);
      padding: 20px;
      text-align: center;
      border-bottom: 3px solid #003366;
    }

    h1 {
      margin: 0;
      font-size: 2rem;
      color: #003366;
      font-weight: 700;
    }

    .dashboard {
      display: flex;
      flex-direction: column;
      gap: 25px;
      padding: 30px;
      max-width: 600px;
      margin: 40px auto;
    }

    .card {
      background: rgba(255, 255, 255, 0.97);
      border-radius: 14px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.15);
      padding: 25px;
    }

    h2 {
      font-size: 1.4rem;
      color: #003366;
      border-left: 5px solid #003366;
      padding-left: 10px;
      margin-bottom: 15px;
    }

    input, button {
      width: 100%;
      margin-top: 8px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 0.95rem;
    }

    button {
      background: #003366;
      border: none;
      color: white;
      margin-top: 18px;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #0055aa; }

    .result {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      text-align: center;
    }

    .confidence {
      margin-top: 8px;
      font-size: 0.9rem;
      font-weight: 600;
    }

    .doctor-note {
      margin-top: 10px;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.9rem;
      background: #eef5ff;
      color: #003366;
    }

    .success { background: #d4edda; color: #155724; }
    .warning { background: #fff3cd; color: #856404; }
    .error { background: #f8d7da; color: #721c24; }

    .loader {
      display: none;
      margin: 12px auto;
      border: 4px solid #f3f3f3;
      border-top: 4px solid #003366;
      border-radius: 50%;
      width: 32px;
      height: 32px;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

<header>
  <h1>🩸 Blood Cancer Prediction System</h1>
</header>

<div class="dashboard">

  <!-- ✅ IMAGE PREDICTION -->
  <div class="card">
    <h2>📷 Detect from Microscopic Image</h2>
     <p>Upload a Microscopic image to analyze for potential Blood cancer.</p>
    <form id="image-form" enctype="multipart/form-data">
      <input type="file" name="file" accept="image/*" required>
      <button type="submit">🧠 Predict from Image</button>
    </form>

    <div class="loader" id="loader_img"></div>
    <div id="image-result" class="result"></div>
    <div id="image-confidence" class="confidence"></div>
    <div id="image-doctor" class="doctor-note"></div>
  </div>

</div>

<script>
  function toggleLoader(id, show){
    document.getElementById(id).style.display = show ? "block" : "none";
  }

  function doctorAdvice(prediction){
    if(prediction.toLowerCase().includes("healthy") || 
       prediction.toLowerCase().includes("no cancer")){
      return "✅ No immediate medical concern detected. Maintain a healthy lifestyle and repeat tests periodically.";
    } else {
      return "⚠️ High risk detected. Please consult an oncologist or hematologist immediately for professional diagnosis.";
    }
  }

  // ✅ IMAGE PREDICTION
  document.getElementById("image-form").addEventListener("submit", async function(e){
    e.preventDefault();
    toggleLoader("loader_img", true);

    const formData = new FormData(this);

    try {
      const response = await fetch("/predict", {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      toggleLoader("loader_img", false);

      const resultDiv = document.getElementById("image-result");
      const confDiv = document.getElementById("image-confidence");
      const docDiv = document.getElementById("image-doctor");

      if (data.error) {
        resultDiv.className = "result error";
        resultDiv.innerText = "⚠️ " + data.error;
      } else {
        resultDiv.className = data.prediction === "Healthy"
          ? "result success"
          : "result warning";

        resultDiv.innerText = "🧠 Prediction: " + data.prediction;
        confDiv.innerText = "📈 Confidence: " + (data.confidence || "N/A") + "%";
        docDiv.innerText = doctorAdvice(data.prediction);
      }

    } catch (err) {
      toggleLoader("loader_img", false);
      document.getElementById("image-result").innerText = "❌ Server Error";
    }
  });
</script>

</body>
</html>
