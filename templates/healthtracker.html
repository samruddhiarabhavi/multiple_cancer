<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Health Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .form-container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .xray-img { max-width: 150px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="container mt-4">
    <h2 class="text-center text-primary">Patient Health Tracker</h2>

    <!-- Form -->
    <div class="form-container mt-4">
      <form method="POST" enctype="multipart/form-data">
        <div class="row mb-3">
          <div class="col-md-6">
            <label class="form-label">Patient Name</label>
            <input type="text" class="form-control" name="name" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Age</label>
            <input type="number" class="form-control" name="age" required>
          </div>
          <div class="col-md-3">
            <label class="form-label">Gender</label>
            <select class="form-control" name="gender" required>
              <option>Male</option>
              <option>Female</option>
              <option>Other</option>
            </select>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-4">
            <label class="form-label">Blood Group</label>
            <input type="text" class="form-control" name="blood_group" required>
          </div>
          <div class="col-md-8">
            <label class="form-label">Notes / Symptoms</label>
            <input type="text" class="form-control" name="notes">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Upload X-ray</label>
          <input type="file" class="form-control" name="xray" accept="image/*">
        </div>

        <button type="submit" class="btn btn-primary">Add Record</button>
      </form>
    </div>

    <!-- Records Table -->
    <div class="mt-5">
      <h4>Patient Records</h4>
      <table class="table table-striped table-bordered">
        <thead class="table-dark">
          <tr>
            <th>Date</th>
            <th>Name</th>
            <th>Age</th>
            <th>Gender</th>
            <th>Blood Group</th>
            <th>Notes</th>
            <th>X-ray</th>
          </tr>
        </thead>
        <tbody>
          {% for record in records %}
          <tr>
            <td>{{ record.date }}</td>
            <td>{{ record.name }}</td>
            <td>{{ record.age }}</td>
            <td>{{ record.gender }}</td>
            <td>{{ record.blood_group }}</td>
            <td>{{ record.notes }}</td>
            <td>
              {% if record.xray %}
                <img src="{{ url_for('static', filename='uploads/' ~ record.xray) }}" class="xray-img">
              {% else %}
                No X-ray
              {% endif %}
            </td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
    </div>
  </div>
</body>
</html>
